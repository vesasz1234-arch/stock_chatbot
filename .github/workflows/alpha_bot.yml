name: Stock Alpha Bot Engine

on:
  schedule:
    # 월~금 00:00 ~ 06:30 UTC (KST 09:00 ~ 15:30 장중 시간 동안 10분 간격 실행)
    - cron: '*/10 0-6 * * 1-5'
  workflow_dispatch:

jobs:
  run-alpha-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy finance-datareader

      - name: Run Alpha Bot Scanner
        env:
          DISCORD_WEBHOOK_URL: "https://discordapp.com/api/webhooks/1534112008767803433/B1S87u-nnaokeMR2lut-FAPv1PJAbeVuQunoWr-4AoZfrG4g70XwhuD8PATpApYgeFt1"
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          python stock_alpha_bot.py --once