name: Stock Bot Scheduled Report

on:
  schedule:
    # 1. 한국 시간 07:30 (UTC 기준 22:30 전날)
    - cron: '30 22 * * *'
    # 2. 한국 시간 16:00 (UTC 기준 07:00 당일)
    - cron: '0 7 * * *'
  workflow_dispatch: # GitHub 웹페이지에서 수동 실행 버튼 활성화

jobs:
  run-stock-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai requests beautifulsoup4 yfinance pandas

      - name: Run Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
        run: python engine.py