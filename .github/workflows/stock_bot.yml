name: Stock Bot Automation

on:
  schedule:
    # 장전 모닝 브리핑: KST 평일 08:10 (UTC 일~목 23:10)
    - cron: '10 23 * * 0-4'
    # 장후 마감 브리핑: KST 평일 18:10 (UTC 월~금 09:10)
    - cron: '10 9 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드 선택 (morning: 장전, evening: 장후)'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - evening

jobs:
  run-stock-bot:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 필수 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests beautifulsoup4 yfinance google-genai

      - name: 실행 모드 판별 및 엔진 구동
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ github.event.inputs.mode }}"
          else
            # UTC 시간 기준 판별 (KST 08:10 = UTC 23:10, KST 18:10 = UTC 09:10)
            HOUR=$(date -u +%H)
            if [ "$HOUR" -ge 18 ] || [ "$HOUR" -lt 4 ]; then
              MODE="morning"
            else
              MODE="evening"
            fi
          fi

          if [ "$MODE" = "morning" ]; then
            echo "🌅 [장전 모드] 월가 기관급 브리핑 파이프라인을 가동합니다."
            python engine.py --mode morning
          else
            echo "🌆 [장후 모드] 월가 기관급 브리핑 파이프라인을 가동합니다."
            python engine.py --mode evening
          fi